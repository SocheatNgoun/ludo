<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludo Game Starter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <div class="info-panel">
            <h1 id="turn-text">Turn: <span style="color: red;">RED</span></h1>
            <div class="dice-box">
                <div id="dice" onclick="rollDice()">🎲</div>
                <p>Click dice to roll</p>
            </div>
            <h2 id="dice-value">0</h2>
        </div>

        <div class="ludo-board">
            <div class="house red-house">
                <div class="token-container">
                    <div class="token red"></div>
                    <div class="token red"></div>
                    <div class="token red"></div>
                    <div class="token red"></div>
                </div>
            </div>

            <div class="house green-house">
                <div class="token-container">
                    <div class="token green"></div>
                    <div class="token green"></div>
                    <div class="token green"></div>
                    <div class="token green"></div>
                </div>
            </div>

            <div class="house yellow-house">
                <div class="token-container">
                    <div class="token yellow"></div>
                    <div class="token yellow"></div>
                    <div class="token yellow"></div>
                    <div class="token yellow"></div>
                </div>
            </div>

            <div class="house blue-house">
                <div class="token-container">
                    <div class="token blue"></div>
                    <div class="token blue"></div>
                    <div class="token blue"></div>
                    <div class="token blue"></div>
                </div>
            </div>

            <div class="center-zone"></div>

            <div class="step" style="grid-column: 7; grid-row: 1;"></div>
            <div class="step" style="grid-column: 8; grid-row: 1;"></div>
            <div class="step" style="grid-column: 9; grid-row: 1;"></div>
            <div class="lane-vertical" style="grid-column: 7 / span 3; grid-row: 1 / span 6;"></div>
            <div class="lane-vertical" style="grid-column: 7 / span 3; grid-row: 10 / span 6;"></div>
            <div class="lane-horizontal" style="grid-column: 1 / span 6; grid-row: 7 / span 3;"></div>
            <div class="lane-horizontal" style="grid-column: 10 / span 6; grid-row: 7 / span 3;"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
